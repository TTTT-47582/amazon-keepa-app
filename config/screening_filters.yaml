# ============================================================
# Amazon 商品リサーチ スクリーニング条件設定ファイル
# ここを変更すればフィルター条件を自由に追加・調整できます
# 変更後はアプリを再起動してください
# ============================================================

# ---- 検索フィルター条件 ----
filters:
  # 販売ランクの上限（数値が小さいほど売れている商品）
  # 例: 50000 → 各カテゴリで上位 50,000 位以内の商品を対象にする
  sales_rank_max: 200000

  # 仕入れ価格帯（日本 Amazon の新品最安値）
  price_min: 1000    # 下限（円）
  price_max: 20000   # 上限（円）

  # 最低レビュー評価（1.0 〜 5.0）
  rating_min: 3.5

  # 最低レビュー数（信頼性の担保）
  review_count_min: 10

  # 今後追加可能な条件の例:
  # drop_percentage_30_min: 5     # 30日間の値下がり率（%）下限
  # bought_past_month_min: 100    # 月間購入数下限
  # categories_include:           # 対象カテゴリ ID リスト
  #   - 0  # 0 = すべてのカテゴリ

# ---- 利益計算設定 ----
profit:
  # 目標利益率（%）: この値以上の商品を緑色でハイライト表示
  target_margin_percent: 30

  # 為替レート（1 USD = X 円）
  # サイドバーでも変更できます
  exchange_rate_jpy_per_usd: 150.0

  # 国際送料の目安（円/kg）
  # EMS: ~2000円/kg、SAL便: ~1000円/kg、船便: ~500円/kg
  shipping_cost_per_kg_jpy: 1500

  # Amazon US 紹介料率（%）
  # カテゴリによって 8〜15% 程度（デフォルトは 15% で保守的に計算）
  fba_referral_fee_percent: 15

  # FBA フルフィルメント基本手数料（USD）
  # 重量によって src/profit_calc.py で自動調整されます
  fba_fulfillment_fee_base_usd: 4.75
